mainSections   = ["post"]
rssFullContent = true

[footer]
    since = 2026

[sidebar]
    emoji    = "🐱"
    subtitle = "Code, life, and everything in between."
    avatar   = "img/cat.jpg"

[article]
    headingAnchor = false
    math          = false
    toc           = true
    readingTime   = true

    [article.license]
        enabled = false
        default = "Licensed under CC BY-NC-SA 4.0"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
        { type = "tag-cloud", params = { limit = 10 } },
    ]
    page     = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "auto"

[imageProcessing]
    [imageProcessing.content]
        enabled = true
    [imageProcessing.thumbnail]
        enabled = true

[comments]
    enabled  = false
    provider = ""

[cookies]
    enabled = false
